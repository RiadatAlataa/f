<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ريادة العطاء</title>
    <meta name="description" content="البوابة والتطبيق الرسمي لجمعية ريادة العطاء لخدمة الإنسان بالعسيلة - إدارة المبادرات، المستفيدين، المتطوعين، والخدمات الإنسانية والتنموية" />
    <meta property="og:title" content="ريادة العطاء" />
    <meta property="og:description" content="البوابة والتطبيق الرسمي لجمعية ريادة العطاء لخدمة الإنسان بالعسيلة" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- PWA & Mobile Standalone Settings -->
    <meta name="theme-color" content="#071C43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ريادة العطاء" />
    <meta name="application-name" content="ريادة العطاء" />
    <meta name="msapplication-TileColor" content="#071C43" />
    <meta name="msapplication-TileImage" content="/pwa-512x512.png" />

    <!-- Official Icons and Manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preload" href="/fonts/LyonArabic-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/LyonArabic-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Google Identity Services (GIS) Web SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Prevent Theme Flash (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('reyadat_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.body && document.body.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pwa-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background-color:#071C43;color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;direction:rtl;z-index:99999;text-align:center;padding:24px;">
        <div style="position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <!-- Ambient Glow -->
          <div style="position:absolute;inset:-8px;border-radius:50%;background:rgba(7,84,199,0.35);filter:blur(20px);"></div>
          <!-- Track Ring -->
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,0.12);"></div>
          <!-- Rotating Blue Ring -->
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#38bdf8;border-right-color:#0754C7;animation:pwa-spin 1.4s linear infinite;box-shadow:0 0 20px rgba(56,189,248,0.4);"></div>
          <!-- Official Logo fixed in center -->
          <div style="position:absolute;inset:10px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#ffffff;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,0.35);">
            <img src="/logo.png" alt="ريادة العطاء" style="width:100%;height:100%;object-fit:contain;aspect-ratio:1/1;" />
          </div>
        </div>
        <h1 style="font-size:22px;font-weight:900;letter-spacing:0.5px;color:#ffffff;margin:0 0 6px 0;">ريادة العطاء</h1>
        <p style="font-size:12px;color:rgba(255,255,255,0.75);font-weight:600;margin:0 0 16px 0;">جمعية ريادة العطاء لخدمة الإنسان بالعسيلة</p>
        <p style="font-size:11px;color:rgba(255,255,255,0.5);margin:0;">جاري تحميل التطبيق...</p>
        <style>
          @keyframes pwa-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
